name: Bulk import reviews & badges

# Запускается вручную из вкладки Actions (кнопка "Run workflow").
# Делает всё за один запуск:
#   1. генерирует data/bulk-import.json (3-5 отзывов на товар + текущий badge)
#   2. заливает это в Contentful (Content Management API)
#   3. подтягивает результат обратно в contentful/cache.json и коммитит его
#
# Нужен секрет CONTENTFUL_MANAGEMENT_TOKEN — Content Management API token
# (право на запись), в дополнение к уже существующим CONTENTFUL_SPACE_ID
# и CONTENTFUL_ACCESS_TOKEN. Добавляется в Settings → Secrets and
# variables → Actions → New repository secret.
# Получить токен: Contentful → Settings → API keys → Content management
# tokens → Generate personal token.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  bulk-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Check secrets are set
        run: |
          missing=""
          [ -z "${{ secrets.CONTENTFUL_SPACE_ID }}" ] && missing="$missing CONTENTFUL_SPACE_ID"
          [ -z "${{ secrets.CONTENTFUL_ACCESS_TOKEN }}" ] && missing="$missing CONTENTFUL_ACCESS_TOKEN"
          [ -z "${{ secrets.CONTENTFUL_MANAGEMENT_TOKEN }}" ] && missing="$missing CONTENTFUL_MANAGEMENT_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Не заданы секреты:$missing — добавьте в Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: 1. Обновить cache.json перед генерацией (актуальные товары)
        run: npm run sync:contentful
        env:
          NEXT_PUBLIC_CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
          NEXT_PUBLIC_CONTENTFUL_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_ACCESS_TOKEN }}

      - name: 2. Сгенерировать data/bulk-import.json
        run: npm run generate:bulk

      - name: 3. Залить отзывы и badge в Contentful
        run: npm run push:contentful
        env:
          NEXT_PUBLIC_CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
          CONTENTFUL_MANAGEMENT_TOKEN: ${{ secrets.CONTENTFUL_MANAGEMENT_TOKEN }}

      - name: 4. Подтянуть результат обратно и закоммитить cache.json
        run: npm run sync:contentful
        env:
          NEXT_PUBLIC_CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
          NEXT_PUBLIC_CONTENTFUL_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_ACCESS_TOKEN }}

      - name: Commit updated cache + сохранить bulk-import.json как артефакт
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add contentful/cache.json
          git diff --staged --quiet || git commit -m "chore: bulk import reviews & badges"
          git push

      - name: Upload bulk-import.json (для проверки, что реально было залито)
        uses: actions/upload-artifact@v4
        with:
          name: bulk-import-log
          path: data/bulk-import.json
